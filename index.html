<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pan de Vida</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff6dc;--bg2:#f3d58a;--tx:#4a3410;--gold:#b8860b;--card:rgba(255,255,255,.72);--glow:rgba(255,200,60,.55);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0d1330;--bg2:#2a2150;--tx:#fdf1cf;--gold:#f4c95d;--card:rgba(255,255,255,.08);--glow:rgba(244,201,93,.45)}}
:root[data-theme="dark"]{--bg1:#0d1330;--bg2:#2a2150;--tx:#fdf1cf;--gold:#f4c95d;--card:rgba(255,255,255,.08);--glow:rgba(244,201,93,.45)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 20%,var(--bg2),var(--bg1) 70%);color:var(--tx);font-family:"Cormorant Garamond",Georgia,serif;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:20px 16px;text-align:center;position:relative}
.rays{position:fixed;left:50%;top:-30vmax;width:160vmax;height:160vmax;margin-left:-80vmax;background:repeating-conic-gradient(from 0deg,var(--glow) 0 6deg,transparent 6deg 18deg);opacity:.35;animation:spin 120s linear infinite;-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.p{position:fixed;bottom:-20px;border-radius:50%;background:var(--gold);opacity:0;animation:up linear infinite;pointer-events:none}
@keyframes up{10%{opacity:.8}100%{transform:translateY(-110vh) translateX(30px);opacity:0}}
main{position:relative;z-index:1;width:100%;max-width:640px}
.cross{font-size:2.2rem;color:var(--gold);text-shadow:0 0 18px var(--glow);animation:fl 4s ease-in-out infinite}
h1{font-size:clamp(2.2rem,8vw,3.6rem);font-weight:700;color:var(--gold);text-shadow:0 0 22px var(--glow);letter-spacing:.02em;margin:4px 0}
.sub{font-size:clamp(1.05rem,3.6vw,1.3rem);font-style:italic;opacity:.85;margin-bottom:22px}
@keyframes fl{50%{transform:translateY(-8px)}}
#btn{font-size:clamp(4rem,18vw,5.5rem);width:clamp(130px,38vw,170px);height:clamp(130px,38vw,170px);border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle,var(--card),transparent 75%);cursor:pointer;box-shadow:0 0 40px var(--glow),inset 0 0 25px var(--glow);animation:pulse 2.6s ease-in-out infinite;-webkit-tap-highlight-color:transparent;transition:transform .2s}
#btn:active{transform:scale(.92)}
#btn.go{animation:shake .6s}
@keyframes pulse{50%{box-shadow:0 0 70px var(--glow),inset 0 0 35px var(--glow);transform:scale(1.05)}}
@keyframes shake{20%{transform:rotate(-12deg) scale(1.1)}40%{transform:rotate(10deg) scale(1.15)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
.hint{margin-top:12px;font-size:1.1rem;opacity:.8}
#card{margin-top:26px;padding:26px 22px;border-radius:22px;background:var(--card);border:1px solid var(--gold);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 50px var(--glow);display:none}
#card.show{display:block;animation:rev .9s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rev{from{opacity:0;transform:translateY(40px) scale(.85);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
#msg{font-size:clamp(1.5rem,5.5vw,2.1rem);font-weight:700;margin:10px 0 14px;line-height:1.2}
#ver{font-size:clamp(1.15rem,4vw,1.45rem);font-style:italic;line-height:1.45}
#ref{margin-top:10px;font-size:1.25rem;font-weight:700;color:var(--gold)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.row button{font:inherit;font-size:1.1rem;font-weight:700;padding:10px 20px;border-radius:30px;border:1px solid var(--gold);background:transparent;color:var(--tx);cursor:pointer;transition:.2s}
.row button:hover{background:var(--gold);color:var(--bg1)}
footer{margin-top:28px;opacity:.7;font-size:1rem;font-style:italic}
</style>
</head>
<body>
<div class="rays"></div>
<main>
<div class="cross">✝</div>
<h1>Pan de Vida</h1>
<p class="sub">Alimento para tu alma, hoy y siempre</p>
<button id="btn" aria-label="Recibir un pan de vida">🍞</button>
<p class="hint" id="hint">Toca el pan para recibir tu mensaje</p>
<section id="card" aria-live="polite">
<p id="msg"></p>
<p id="ver"></p>
<p id="ref"></p>
<div class="row"><button id="again">🍞 Otro pan</button><button id="copy">Compartir</button></div>
</section>
<footer>«No solo de pan vivirá el hombre, sino de toda palabra que sale de la boca de Dios» — Mateo 4:4</footer>
</main>
<script>

Juan 8:12|Yo soy la luz del mundo; el que me sigue, no andará en tinieblas.|Sigue la Luz y no tropezarás.

Miqueas 7:7|Yo miraré a Jehová, esperaré al Dios de mi salvación; el Dios mío me oirá.|Dios te escucha, aunque no lo sientas.

Salmos 40:1|Esperé pacientemente a Jehová, y se inclinó a mí, y oyó mi clamor.|Dios se inclina para oírte.
Mateo 6:34|No os afanéis por el día de mañana, porque el día de mañana traerá su afán.|Vive hoy; mañana está en sus manos.
Isaías 12:2|He aquí Dios es salvación mía; me aseguraré y no temeré.|Con Dios, el miedo pierde poder.
Salmos 147:3|Él sana a los quebrantados de corazón, y venda sus heridas.|Dios cura lo que nadie ve.

Salmos 25:4|Muéstrame, oh Jehová, tus caminos; enséñame tus sendas.|Pídele dirección y Él te guiará.

Juan 13:34|Un mandamiento nuevo os doy: que os améis unos a otros.|El amor es la señal de los hijos de Dios.
Salmos 138:8|Jehová cumplirá su propósito en mí; tu misericordia, oh Jehová, es para siempre.|Dios terminará lo que empezó en ti.
Filipenses 1:6|El que comenzó en vosotros la buena obra, la perfeccionará hasta el día de Jesucristo.|Aún no termina: Dios sigue obrando.
Isaías 55:12|Con alegría saldréis, y con paz seréis vueltos.|Saldrás con alegría y volverás en paz.
Salmos 18:2|Jehová, roca mía y castillo mío, y mi libertador; Dios mío, fortaleza mía, en él confiaré.|Dios es tu castillo seguro.

Salmos 119:11|En mi corazón he guardado tus dichos, para no pecar contra ti.|Guarda su Palabra en tu corazón.

Juan 1:5|La luz en las tinieblas resplandece, y las tinieblas no prevalecieron contra ella.|La luz de Dios siempre gana.`.split("\n").map(l=>l.split("|"));
const $=id=>document.getElementById(id);
let bag=[],shown=0;
function next(){if(!bag.length){bag=D.map((_,i)=>i);for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}return bag.pop()}
function pan(){
  const b=$("btn");b.classList.remove("go");void b.offsetWidth;b.classList.add("go");
  const i=next(),[ref,ver,msg]=D[i];shown++;
  setTimeout(()=>{
    const c=$("card");c.classList.remove("show");void c.offsetWidth;
    $("msg").textContent=msg;$("ver").textContent="«"+ver+"»";$("ref").textContent="— "+ref;
    c.classList.add("show");$("hint").textContent="Toca otra vez para recibir un nuevo pan";
    c.scrollIntoView({behavior:"smooth",block:"center"});
    for(let k=0;k<14;k++)spark();
  },450);
}
function spark(){const s=document.createElement("span");s.textContent="✨";s.style.cssText="position:fixed;z-index:5;pointer-events:none;font-size:"+(14+Math.random()*16)+"px;left:"+(20+Math.random()*60)+"vw;top:"+(30+Math.random()*30)+"vh;transition:all 1.4s ease-out;opacity:1";document.body.appendChild(s);requestAnimationFrame(()=>{s.style.transform="translate("+(Math.random()*120-60)+"px,-"+(60+Math.random()*100)+"px) scale(1.6)";s.style.opacity="0"});setTimeout(()=>s.remove(),1500)}
$("btn").onclick=pan;$("again").onclick=pan;
$("copy").onclick=async()=>{const t=$("msg").textContent+"\n"+$("ver").textContent+"\n"+$("ref").textContent+"\n\n🍞 Pan de Vida";try{if(navigator.share){await navigator.share({text:t})}else{await navigator.clipboard.writeText(t);$("copy").textContent="¡Copiado!";setTimeout(()=>$("copy").textContent="Compartir",1500)}}catch(e){}};
for(let i=0;i<28;i++){const p=document.createElement("span");p.className="p";const s=2+Math.random()*5;p.style.cssText="left:"+Math.random()*100+"vw;width:"+s+"px;height:"+s+"px;animation-duration:"+(8+Math.random()*12)+"s;animation-delay:"+Math.random()*10+"s";document.body.appendChild(p)}
</script>
</body>
</html>
